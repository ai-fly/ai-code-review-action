name: Reusable Codex Code Review

on:
  workflow_call:
    inputs:
      model:
        description: Codex model; empty means use the default
        required: false
        type: string
        default: ""

      effort:
        description: Codex reasoning effort
        required: false
        type: string
        default: high

      min_severity:
        description: Minimum severity to report
        required: false
        type: string
        default: medium

      rules_path:
        description: Project-specific review rules path
        required: false
        type: string
        default: AGENTS.md

      rules_required:
        description: Fail when the project rules file does not exist
        required: false
        type: boolean
        default: false

      responses_api_endpoint:
        description: Optional full Responses API endpoint
        required: false
        type: string
        default: ""

    secrets:
      openai_api_key:
        description: OpenAI API key
        required: true

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      final_message: ${{ steps.review.outputs.final_message }}

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Run Giggle Codex Review
        id: review
        uses: GiggleAcademy/giggle-common-actions/codereview@main
        with:
          openai_api_key: ${{ secrets.openai_api_key }}
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          min_severity: ${{ inputs.min_severity }}
          rules_path: ${{ inputs.rules_path }}
          rules_required: ${{ inputs.rules_required }}
          responses_api_endpoint: ${{ inputs.responses_api_endpoint }}

  comment:
    needs: review
    if: ${{ needs.review.outputs.final_message != '' }}
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Create or update PR review comment
        uses: actions/github-script@v7
        env:
          REVIEW_RESULT: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const marker = '<!-- giggle-codex-review -->';
            const body = `${marker}\n${process.env.REVIEW_RESULT}`;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                per_page: 100
              }
            );

            const previous = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }

